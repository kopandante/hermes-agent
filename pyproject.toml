[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kermit"
version = "0.1.0"
description = "Personal DevOps agent"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "openai>=2.21.0,<3",
  "httpx>=0.28.1,<1",
  "pydantic>=2.12.5,<3",
  "pyyaml>=6.0.2,<7",
  "python-dotenv>=1.2.1,<2",
  "rich>=14.3.3,<15",
  "tenacity>=9.1.4,<10",
  "jinja2>=3.1.5,<4",
  "requests>=2.33.0,<3",
  "python-telegram-bot[webhooks]>=22.6,<23",
  "aiohttp>=3.13.3,<4",
  "parallel-web>=0.4.2,<1",
  "firecrawl-py>=4.16.0,<5",
  "faster-whisper>=1.0.0,<2",
  "sounddevice>=0.4.6,<1",
  "numpy>=1.24.0,<3",
  "mcp>=1.2.0,<2",
  "croniter>=6.0.0,<7",
]

[project.scripts]
kermit = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["agent", "agent.*", "gateway", "gateway.*", "tools", "tools.*", "config", "config.*"]
